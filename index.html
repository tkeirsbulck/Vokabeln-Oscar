  // --- Sprach-Erkennung (Deutsch vs. Englisch) ---------------------------
  var DE_WORDS = ["der","die","das","und","ist","nicht","ein","eine","einen","einer",
    "eines","im","zu","von","an","bei","wie","was","wer","wo","wenn","aber","oder",
    "auch","noch","schon","sehr","viel","viele","gut","kann","muss","wird","haben",
    "hat","hatte","sein","sich","mit","für","auf","aus","um","durch","gegen","ohne",
    "unter","über","vor","nach","seit","während","wegen","trotz","ich","du","er","sie",
    "es","wir","ihr","mein","dein","unser","euer","nein","ja","heute","morgen",
    "gestern","immer","nie","jetzt","hier","dort","dann","also","weil","dass","damit",
    "obwohl","werden","würde","können","müssen","sollen","dürfen","mögen","zwischen",
    "jemand","niemand","etwas","nichts","alle","jede","jeder","jedes"];
  var EN_WORDS = ["the","and","is","to","of","in","a","an","that","this","with","for",
    "on","at","by","from","but","not","are","was","were","have","has","will","would",
    "could","should","can","do","does","did","i","you","he","she","it","we","they",
    "my","your","his","her","its","our","their","no","yes","today","tomorrow",
    "yesterday","always","never","now","here","there","then","so","because",
    "although","if","when","what","who","where","how","someone","nobody","something",
    "nothing","all","every","each","between","must","may","might"];
  var DE_WORD_SET = {}, EN_WORD_SET = {};
  DE_WORDS.forEach(function(w){ DE_WORD_SET[w] = true; });
  EN_WORDS.forEach(function(w){ EN_WORD_SET[w] = true; });

  function wordDeScore(raw){
    var w = (raw||"").trim();
    if(!w) return 0;
    var lower = w.toLowerCase();
    var tokens = lower.split(/\s+/);
    var score = 0;
    if(/[äöüß]/.test(lower)) score += 3;
    if(DE_WORD_SET[tokens[0]]) score += 3;
    tokens.forEach(function(tok){ if(DE_WORD_SET[tok]) score += 1; });
    if(/(ung|heit|keit|schaft|chen|lein)$/.test(lower)) score += 2;
    if(/^zu [a-zäöü]+$/.test(lower)) score += 2; // "zu gehen" etc.
    // Deutsche Substantive werden großgeschrieben - hilfreiches Signal bei
    // reinen Inhaltswörtern (z.B. "Haus" vs. "house"), wenn kein Funktions-
    // wort getroffen hat.
    if(tokens.length === 1 && /^[A-ZÄÖÜ][a-zäöüß-]+$/.test(w)) score += 1.3;
    return score;
  }

  function wordEnScore(raw){
    var w = (raw||"").trim();
    if(!w) return 0;
    var lower = w.toLowerCase();
    var tokens = lower.split(/\s+/);
    var score = 0;
    if(EN_WORD_SET[tokens[0]]) score += 3;
    tokens.forEach(function(tok){ if(EN_WORD_SET[tok]) score += 1; });
    if(/^to [a-z]+$/.test(lower)) score += 3; // "to go" etc.
    if(!/[äöüß]/.test(lower) && /(tion|sion|ness|ful|ity|ous|ing)$/.test(lower)) score += 2;
    return score;
  }

  var HEADER_WORDS = ["deutsch","englisch","english","german","translation",
    "übersetzung","wort","wörter","word","words","vocab","vocabulary","vokabel",
    "vokabeln","vokabular","de","en","deu","dt","dt.","engl","engl.",
    "infinitiv","infinitive","simple past","past","past participle",
    "partizip","partizip ii","partizip 2","pp","verb","verben","tense","tenses",
    "zeitform","zeitformen","präsens","present"];

  // Erkennt auch leicht abgeschnittene Kopfzeilen-Wörter, z.B. wenn der
  // Spalten-Zuschnitt das erste Zeichen mit erwischt hat ("erman" statt
  // "German", "nglish" statt "English").
  function isHeaderWord(v){
    var vl = (v||"").trim().toLowerCase();
    if(!vl) return false;
    if(HEADER_WORDS.indexOf(vl) !== -1) return true;
    return HEADER_WORDS.some(function(hw){
      return hw.length >= 4 && (vl === hw.slice(1) || vl === hw.slice(0, -1));
    });
  }

  // Für die Sonderprüfung der allerersten Zeile werden nur Begriffe
  // herangezogen, die so gut wie nie eine echte Vokabel wären (nur reine
  // Spaltenüberschriften). Wörter wie "Wort"/"word" oder "present" bleiben
  // bewusst außen vor, da das echte, lernenswerte Vokabeln sein könnten.
  var STRONG_HEADER_WORDS = ["deutsch","englisch","english","german",
    "infinitiv","infinitive","simple past","past participle",
    "partizip","partizip ii","partizip 2","zeitform","zeitformen"];

  function isHeaderRow(row, isFirstRow){
    var de = (row.de||"").trim().toLowerCase();
    var en = (row.en||"").trim().toLowerCase();
    if(isHeaderWord(de) && isHeaderWord(en)) return true;
    if(isFirstRow){
      return STRONG_HEADER_WORDS.indexOf(de) !== -1 || STRONG_HEADER_WORDS.indexOf(en) !== -1;
    }
    return false;
  }

  // Generische Variante für beliebig viele Spalten (z.B. 4 bei Verben mit
  // 3 Zeitformen). Zwei Regeln:
  //  1) ALLE (oder alle bis auf eine) nicht-leeren Werte sind Kopfzeilen-
  //     Wörter - funktioniert unabhängig von der Zeilenposition.
  //  2) Nur für die ALLERERSTE Zeile: reicht schon EIN eindeutiges
  //     Kopfzeilen-Wort (z.B. "German" oder "Simple Past"), selbst wenn die
  //     übrigen Spalten der Überschrift (z.B. durch fette/verzierte
  //     Schrift) nicht korrekt erkannt wurden.
  function isHeaderRowValues(values, isFirstRow){
    var nonEmpty = values.filter(function(v){ return (v||"").trim(); });
    if(nonEmpty.length < 2) return false;
    var matchCount = nonEmpty.filter(isHeaderWord).length;
    // Toleriert einen einzelnen Ausreißer (z.B. eine Spalte, die durch eine
    // leichte Fehlzuordnung nicht exakt das Kopfzeilen-Wort enthält).
    if(matchCount >= nonEmpty.length - 1 && matchCount >= 2) return true;
    if(isFirstRow){
      return nonEmpty.some(function(v){ return STRONG_HEADER_WORDS.indexOf(v.trim().toLowerCase()) !== -1; });
    }
    return false;
  }

  function filterHeaderValueRows(rows){
    return rows.filter(function(r, idx){ return !isHeaderRowValues(r.values, idx === 0); });
  }

  function objectifyRows(rows, keys){
    return rows.map(function(r){
      var obj = {};
      keys.forEach(function(k, i){ obj[k] = cleanVocabCell(r.values[i] || ""); });
      obj._y = r.y;
      return obj;
    });
  }

  // Entfernt typische Störsignale aus Wörterbuch-Tabellen, die sonst als
  // Teil der Vokabel gespeichert würden: Fußnoten-Sternchen ("bet*",
  // "burn***") und britische/amerikanische Varianten-Kürzel ("AE"/"BE").
  function cleanVocabCell(raw){
    var s = (raw||"").trim();
    s = s.replace(/\s*\*+\s*$/, "");
    // Nur entfernen, wenn danach noch Inhalt übrig bleibt - sonst würde z.B.
    // das Verb "be" selbst als "BE"-Dialektkürzel fehlerkannt und gelöscht.
    var withoutTag = s.replace(/\s*\(?\b(AE|BE)\b\)?\s*$/i, "").trim();
    if(withoutTag) s = withoutTag;
    return s.trim();
  }

  // Bei Verben mit 3 Zeitformen kann die deutsche Spalte an beliebiger
  // Position stehen (z.B. zuerst oder zuletzt). Diese Funktion erkennt
  // automatisch, welche der Spalten Deutsch ist (per Sprach-Erkennung über
  // alle Zeilen hinweg), und ordnet die restlichen 3 Spalten - in ihrer
  // ursprünglichen Reihenfolge - als Infinitiv/Simple Past/Partizip II ein.
  // Die deutsche Bedeutungsspalte listet bei Wörterbuch-Tabellen oft
  // mehrere Bedeutungen auf (getrennt durch ";" oder ",", ergänzt durch
  // Klammer-Hinweise wie "(Geld)") - während die drei Verbform-Spalten
  // fast immer aus einem einzelnen, unpunktierten Wort bestehen. Dieses
  // Signal ist deutlich zuverlässiger als reine Wort-Erkennung, gerade bei
  // kurzen, unauffälligen Wörtern ohne erkennbare Sprachmerkmale.
  function complexityScore(text){
    var t = text || "";
    var score = 0;
    score += (t.match(/;/g)||[]).length * 2;
    score += (t.match(/,/g)||[]).length * 1.5;
    score += (t.match(/\(/g)||[]).length * 1.5;
    var wordCount = t.trim().split(/\s+/).filter(Boolean).length;
    score += Math.max(0, wordCount - 1) * 0.8;
    return score;
  }

  function reorderVerb3Columns(rows){
    if(!rows.length || rows[0].values.length !== 4) return rows;
    var colCount = rows[0].values.length;
    var scores = new Array(colCount).fill(0);
    rows.forEach(function(r){
      for(var c=0;c<colCount;c++){
        scores[c] += wordDeScore(r.values[c]) - wordEnScore(r.values[c]) + complexityScore(r.values[c]);
      }
    });
    var deIdx = 0, bestScore = -Infinity;
    scores.forEach(function(s,i){ if(s > bestScore){ bestScore = s; deIdx = i; } });
    return rows.map(function(r){
      var rest = r.values.filter(function(_, i){ return i !== deIdx; });
      return { values: [r.values[deIdx]].concat(rest), y: r.y };
    });
  }

  // Fallback ohne Positionsdaten: rein indexbasiertes Zusammenfügen über
  // beliebig viele Spalten.
  function zipColumnsIndexBased(columnsOfLines){
    var n = 0;
    columnsOfLines.forEach(function(arr){ n = Math.max(n, arr.length); });
    var rows = [];
    for(var i=0;i<n;i++){
      var vals = columnsOfLines.map(function(arr){ return arr[i] || ""; });
      if(vals.some(function(v){ return v; })) rows.push(vals);
    }
    return rows;
  }

  // Prüft für eine Liste von Wortpaaren, ob die Spalten vertauscht sind
  // (also rechts eigentlich Deutsch und links eigentlich Englisch ist),
  // und tauscht sie in diesem Fall automatisch. Entfernt außerdem reine
  // Kopfzeilen wie "Deutsch | Englisch", die versehentlich mit erkannt wurden.
  function autoOrderRows(rows){
    if(!rows || rows.length === 0) return rows;
    rows = rows.filter(function(r, idx){ return !isHeaderRow(r, idx === 0); });
    if(rows.length === 0) return rows;
    var leftNet = 0, rightNet = 0;
    rows.forEach(function(r){
      leftNet += wordDeScore(r.de) - wordEnScore(r.de);
      rightNet += wordDeScore(r.en) - wordEnScore(r.en);
    });
    var swapped = rightNet - leftNet > 1.5;
    if(swapped){
      rows.forEach(function(r){ var tmp = r.de; r.de = r.en; r.en = tmp; });
    }
    rows.swapped = swapped;
    return rows;
  }

  function cleanLines(text){
    return text.split(/\r?\n/)
      .map(function(l){ return l.trim(); })
      .filter(function(l){
        if(!l) return false;
        if(!/[A-Za-zÄÖÜäöüß]/.test(l)) return false; // drop artifact-only lines (digits, bars, symbols)
        return true;
      });
  }

  // Fallback: rein indexbasiertes Zusammenfügen (wird nur genutzt, falls
  // keine Positionsdaten von Tesseract vorliegen).
  function zipLines(leftLines, rightLines){
    var n = Math.max(leftLines.length, rightLines.length);
    var rows = [];
    for(var i=0;i<n;i++){
      var de = leftLines[i] || "";
      var en = rightLines[i] || "";
      if(de || en) rows.push({de:de, en:en});
    }
    return rows;
  }

  // Extrahiert Zeilen inkl. vertikaler Position (Bounding-Box) aus einem
  // Tesseract-Ergebnis. So lässt sich später anhand der tatsächlichen Höhe
  // im Bild zuordnen, welche deutsche Zeile zu welcher englischen gehört -
  // statt sich blind auf die Reihenfolge zu verlassen.
  function extractPositionedLines(ocrResult, normHeight){
    var rawLines = (ocrResult && ocrResult.data && ocrResult.data.lines) ? ocrResult.data.lines : null;
    if(!rawLines || !rawLines.length) return null;
    var out = [];
    rawLines.forEach(function(l){
      var text = (l.text || "").trim();
      if(!text) return;
      if(!/[A-Za-zÄÖÜäöüß]/.test(text)) return;
      if(!l.bbox) return;
      var yCenter = (l.bbox.y0 + l.bbox.y1) / 2;
      var height = Math.max(1, l.bbox.y1 - l.bbox.y0);
      // Jede Spalte kann unterschiedlich stark hochskaliert worden sein
      // (regionToDataURL), je nachdem wie schmal sie ursprünglich war.
      // Ohne Normalisierung wären die Pixel-Y-Werte zwischen Spalten nicht
      // vergleichbar, was zu einer schleichenden Fehlzuordnung über die
      // Zeilen hinweg führt. Wir rechnen daher auf den Anteil der
      // (skalierten) Bildhöhe um, was wieder dem Anteil der ORIGINAL-
      // Bildhöhe entspricht - und damit über alle Spalten hinweg konsistent
      // vergleichbar ist.
      if(normHeight){
        yCenter = yCenter / normHeight;
        height = height / normHeight;
      }
      out.push({ text: text, y: yCenter, height: height });
    });
    if(!out.length) return null;
    out.sort(function(a,b){ return a.y - b.y; });
    return out;
  }

  // HINWEIS: Ein früherer Versuch, auf zwei Zeilen umgebrochene Übersetzungen
  // (z.B. "biro/ball" + "pen") automatisch wieder zusammenzuführen, hat sich
  // in der Praxis als zu unzuverlässig erwiesen: bei eng gedruckten Listen
  // wurden dadurch fälschlich echte, separate Zeilen verschmolzen (z.B.
  // "vorne" + "hinten" zu "in front behind"). Der seltene Umbruch-Fall lässt
  // sich stattdessen bequem über die rot markierten Felder im
  // Prüfen-Bildschirm von Hand korrigieren - das ist deutlich sicherer als
  // eine Heuristik, die bei jeder Tabelle anders "danebenraten" kann.

  function averageHeight(lines){
    if(!lines.length) return 0.03;
    var sum = 0;
    lines.forEach(function(l){ sum += l.height; });
    return sum / lines.length;
  }

  // Fallback, falls eine Spalte keine brauchbaren Positionsdaten liefert
  // (z.B. weil Tesseract für diese Spalte keine bbox-Werte zurückgibt).
  // Verteilt die erkannten Zeilen gleichmäßig über die Bildhöhe, damit sie
  // trotzdem an der ungefähr richtigen Stelle einsortiert werden, statt die
  // Positions-Zuordnung für die GESAMTE Tabelle aufzugeben.
  function interpolatePositions(lines){
    var n = lines.length;
    if(n === 0) return [];
    return lines.map(function(t, i){
      return { text: t, y: (i + 0.5) / n, height: 1 / n };
    });
  }

  // Ordnet zwei Spalten anhand ihrer vertikalen Position einander zu.
  // WICHTIG: Beide Spalten sind von oben nach unten sortiert. Statt bei
  // jeder Zeile stur die insgesamt nächstgelegene (noch freie) Zeile aus der
  // anderen Spalte zu suchen - was bei einer verrutschten Zeile zu einem
  // "Sprung" führen und nachfolgende Zeilen falsch zuordnen kann - läuft
  // diese Version wie ein Reißverschluss strikt in Lesereihenfolge durch
  // beide Spalten. Das ist deutlich robuster, u.a. wenn eine englische
  // Übersetzung im Bild auf zwei Zeilen umbricht oder eine Zeile in einer
  // Spalte fälschlich übersehen/zusätzlich erkannt wurde: nur die
  // betroffene Stelle bleibt unvollständig, alles andere bleibt synchron.
  function alignTwoColumns(baseRows, colLines, colIndex){
    var avgH = averageHeight(baseRows.map(function(r){ return {height:r.h}; }).concat(colLines));
    var tolerance = Math.max(avgH * 0.85, 0.012);
    var result = [];
    var ri = 0, ci = 0;

    while(ri < baseRows.length && ci < colLines.length){
      var row = baseRows[ri], cl = colLines[ci];
      var dist = cl.y - row.y;
      if(Math.abs(dist) <= tolerance){
        row.values.push(cl.text);
        row.y = (row.y + cl.y) / 2;
        row.h = (row.h + cl.height) / 2;
        result.push(row);
        ri++; ci++;
      } else if(dist < 0){
        // Die neue Zeile liegt deutlich VOR der aktuellen Basis-Zeile ->
        // eigener Eintrag ohne Gegenstück in den bisherigen Spalten.
        var vals = new Array(colIndex).fill("");
        vals.push(cl.text);
        result.push({ values: vals, y: cl.y, h: cl.height });
        ci++;
      } else {
        // Die Basis-Zeile hat (bisher) kein Gegenstück in dieser Spalte.
        row.values.push("");
        result.push(row);
        ri++;
      }
    }
    while(ri < baseRows.length){ baseRows[ri].values.push(""); result.push(baseRows[ri]); ri++; }
    while(ci < colLines.length){
      var vals2 = new Array(colIndex).fill("");
      vals2.push(colLines[ci].text);
      result.push({ values: vals2, y: colLines[ci].y, h: colLines[ci].height });
      ci++;
    }
    result.sort(function(a,b){ return a.y - b.y; });
    return result;
  }

  // Verallgemeinerte Version für beliebig viele Spalten (z.B. 4 bei Verben
  // mit 3 Zeitformen). "columns" ist ein Array von Zeilen-Arrays (je
  // Spalte), jeweils mit {text,y,height}. Rückgabe: Array von Werte-Arrays.
  function mergeColumnsByPosition(columns){
    if(!columns.length) return [];
    var rows = columns[0].map(function(l){ return { values: [l.text], y: l.y, h: l.height }; });
    for(var c=1; c<columns.length; c++){
      rows = alignTwoColumns(rows, columns[c], c);
    }
    return rows;
  }

  // Schneidet einen Bildbereich aus und skaliert ihn bei Bedarf hoch.
  // Sehr kleine Fotos/Ausschnitte (z.B. schmale Spalten) liefern sonst
  // deutlich schlechtere OCR-Ergebnisse.
  function regionToDataURL(img, sx, sy, sw, sh, minWidth){
    minWidth = minWidth || 700;
    var scale = sw < minWidth ? (minWidth / sw) : 1;
    var destW = Math.max(1, Math.round(sw * scale));
    var destH = Math.max(1, Math.round(sh * scale));
    var canvas = document.createElement("canvas");
    canvas.width = destW; canvas.height = destH;
    var ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    if("imageSmoothingQuality" in ctx) ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, destW, destH);
    return { url: canvas.toDataURL("image/png"), destH: destH };
  }

  // Zweiter, gezielter Erkennungsversuch NUR für Zeilen, bei denen ein Wort
  // fehlt: schneidet einen schmalen Streifen genau um diese eine Zeile aus
  // und erkennt ihn im Einzelzeilen-Modus (PSM 7) neu. Das ist präziser als
  // der erste Durchlauf, der die ganze Spalte auf einmal liest, und rettet
  // damit oft Wörter, die beim ersten Versuch übersehen wurden.
  function retryMissingPairCells(img, rows, colBounds, wasSwapped){
    var h = img.naturalHeight;
    var tasks = [];
    rows.forEach(function(row, idx){
      ["de","en"].forEach(function(field){
        if((row[field]||"").trim()) return; // nicht fehlend
        if(row._y === undefined || row._y === null) return;
        var isDe = field === "de";
        var colIdx = wasSwapped ? (isDe ? 1 : 0) : (isDe ? 0 : 1);
        var bounds = colBounds[colIdx];
        if(!bounds) return;

        var prevY = idx > 0 ? rows[idx-1]._y : null;
        var nextY = idx < rows.length-1 ? rows[idx+1]._y : null;
        var gaps = [];
        if(prevY != null) gaps.push(row._y - prevY);
        if(nextY != null) gaps.push(nextY - row._y);
        var localGap = gaps.length ? (gaps[0] + (gaps[1]||gaps[0])) / (gaps[1]!=null?2:1) : 0.06;
        var halfBand = Math.max(localGap * 0.6, 0.015);

        tasks.push({
          idx: idx, field: field, colIdx: colIdx,
          y0: Math.max(0, Math.round((row._y - halfBand) * h)),
          y1: Math.min(h, Math.round((row._y + halfBand) * h))
        });
      });
    });

    if(!tasks.length) return Promise.resolve();

    var promises = tasks.map(function(t){
      var bounds = colBounds[t.colIdx];
      var sh = Math.max(1, t.y1 - t.y0);
      var region = regionToDataURL(img, bounds.sx, t.y0, bounds.sw, sh, 500);
      return Tesseract.recognize(region.url, "deu+eng", { tessedit_pageseg_mode: "7" });
    });

    return Promise.all(promises).then(function(results){
      results.forEach(function(res, i){
        var t = tasks[i];
        var text = (res && res.data && res.data.text) ? res.data.text : "";
        var lines = cleanLines(text);
        var value = lines.length ? cleanVocabCell(lines.join(" ")) : "";
        if(value) rows[t.idx][t.field] = value;
      });
    });
  }

  function runTableOcr(){
    var img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight;
      var cfg = vocabConfig(state.vocabType);
      // Kleiner, überwiegend FESTER Rand um jede Linie (nicht prozentual):
      // Ein prozentualer Rand wird bei großen Bildern unnötig breit und
      // schneidet dann in den Text hinein, wenn die Linie bewusst eng ans
      // Wort gezogen wird. Ein kleiner fester Wert reicht, um nur die
      // Linie selbst auszusparen.
      var margin = Math.max(3, Math.round(w * 0.004));
      var boundariesPct = [0].concat(state.cropSplits).concat([100]);
      var colCount = cfg.keys.length;
      var ocrOptions = { tessedit_pageseg_mode: "4" };

      var promises = [];
      var destHeights = [];
      var colBounds = [];
      for(var i=0; i<colCount; i++){
        var sxRaw = Math.round(w * boundariesPct[i] / 100);
        var exRaw = Math.round(w * boundariesPct[i+1] / 100);
        var sx = i === 0 ? 0 : sxRaw + margin;
        var ex = i === colCount-1 ? w : exRaw - margin;
        var sw = Math.max(1, ex - sx);
        colBounds.push({ sx: sx, sw: sw });
        // Wichtig: schmale, einspaltige Ausschnitte werden von Tesseract im
        // Standardmodus ("ein einzelner Textblock") oft komplett falsch
        // gelesen. Der Modus "einspaltiger Text" (PSM 4) liefert hier
        // zuverlässige Ergebnisse. Zusätzlich werden kleine Ausschnitte
        // hochskaliert, da niedrige Auflösung die Erkennung verschlechtert.
        var region = regionToDataURL(img, sx, 0, sw, h, 700);
        destHeights.push(region.destH);
        promises.push(Tesseract.recognize(region.url, "deu+eng", ocrOptions));
      }

      Promise.all(promises).then(function(results){
        var positionedCols = results.map(function(r, i){
          var pos = extractPositionedLines(r, destHeights[i]);
          if(pos) return pos;
          // Diese eine Spalte hat keine brauchbaren Positionsdaten geliefert
          // (selten, z.B. bei sehr unscharfem Text). Statt deswegen die
          // Positions-Zuordnung für die GESAMTE Tabelle aufzugeben, werden
          // ihre Zeilen gleichmäßig über die Höhe verteilt und können so
          // weiterhin an der richtigen Stelle einsortiert werden.
          return interpolatePositions(cleanLines(r.data.text || ""));
        });
        var mergedRows = mergeColumnsByPosition(positionedCols);
        mergedRows = filterHeaderValueRows(mergedRows);
        if(state.vocabType === "verb3") mergedRows = reorderVerb3Columns(mergedRows);
        var rows = objectifyRows(mergedRows, cfg.keys);

        function finish(){
          rows.forEach(function(r){ delete r._y; });
          state.captureLoading = false;
          state.reviewVocabType = state.vocabType;
          state.reviewRows = rows.length ? rows : [emptyRow(state.vocabType)];
          state.view = "review";
          render();
        }

        if(state.vocabType === "pair"){
          rows = autoOrderRows(rows);
          var wasSwapped = !!rows.swapped;
          var hasMissing = rows.some(function(r){ return !(r.de||"").trim() || !(r.en||"").trim(); });
          if(hasMissing){
            state.captureLoadingMsg = "Fehlende Wörter werden erneut geprüft …";
            render();
            retryMissingPairCells(img, rows, colBounds, wasSwapped).then(finish).catch(finish);
            return;
          }
        }
        finish();
      }).catch(ocrFailFallback);
    };
    img.onerror = ocrFailFallback;
    img.src = state.captureImage;
  }

  function saveReviewRows(){
    var type = state.reviewVocabType;
    var cfg = vocabConfig(type);
    var completeItems = [];
    var incompleteCount = 0;

    state.reviewRows.forEach(function(row){
      var vals = {};
      cfg.keys.forEach(function(k){ vals[k] = (row[k]||"").trim(); });
      var isComplete = cfg.keys.every(function(k){ return vals[k]; });
      var hasAnyContent = cfg.keys.some(function(k){ return vals[k]; });
      if(isComplete){
        var item = { id: uid(), type: type, folder: "nicht", streak: 0 };
        cfg.keys.forEach(function(k){ item[k] = vals[k]; });
        completeItems.push(item);
      } else if(hasAnyContent){
        incompleteCount++;
      }
    });

    // Kontrollprüfung: unvollständige Zeilen (rot markiert, z.B. weil die
    // Texterkennung ein Wort nicht gefunden hat) werden NICHT stillschweigend
    // verworfen. Stattdessen wird nachgefragt, damit nichts verloren geht.
    if(incompleteCount > 0){
      var msg = incompleteCount + (incompleteCount===1 ? " Zeile ist" : " Zeilen sind") +
        " unvollständig (rot markiert) und würde" + (incompleteCount===1 ? "" : "n") +
        " beim Speichern übersprungen. Zurück und ergänzen? Zum trotzdem Speichern auf Abbrechen tippen.";
      var goBackAndFix = confirm(msg);
      if(goBackAndFix) return; // auf dem Review-Screen bleiben, damit ergänzt werden kann
    }

    completeItems.forEach(function(item){ state.data.items.push(item); });
    saveData();
    state.view = "home";
    render();
  }

  // Export als Datei, damit die Vokabeln auf einem anderen Gerät (z.B.
  // Tablet) wieder eingelesen werden können - unabhängig davon, ob die App
  // dort als Datei geöffnet oder als Artefakt genutzt wird.
  function exportData(){
    try{
      var json = JSON.stringify(state.data, null, 2);
      var blob = new Blob([json], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var stamp = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = "vokabeltrainer-backup-" + stamp + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    }catch(e){
      alert("Export fehlgeschlagen. Bitte versuche es erneut.");
    }
  }

  function importData(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(!parsed || !Array.isArray(parsed.items)){
          alert("Diese Datei sieht nicht wie eine Vokabeltrainer-Sicherung aus.");
          return;
        }
        var existingIds = {};
        state.data.items.forEach(function(i){ existingIds[i.id] = true; });
        var addedPair = 0, addedVerb3 = 0;
        parsed.items.forEach(function(item){
          if(!item || !item.id || existingIds[item.id]) return;
          state.data.items.push(item);
          if(itemType(item) === "verb3") addedVerb3++; else addedPair++;
        });
        saveData();
        render();
        var added = addedPair + addedVerb3;
        var detail = added > 0 ? " (" + addedPair + " normale, " + addedVerb3 + " mit 3 Zeitformen)" : "";
        alert(added + " Vokabel" + (added===1?"":"n") + " importiert" + detail + ".");
      }catch(e){
        alert("Datei konnte nicht gelesen werden. Ist es eine gültige Sicherungsdatei?");
      }
    };
    reader.readAsText(file);
  }

  function startLearning(folder){
    var pool = itemsIn(folder, state.learnTypeFilter);
    if(pool.length === 0) return;
    var sessionDir = state.learnTypeFilter === "verb3" ? state.data.settings.verb3Direction : state.data.settings.direction;

    var queue = shuffle(pool).map(function(item){
      // Im Karteikasten "Kann ich fast" ist pro Vokabel bereits eine
      // Richtung richtig beantwortet worden - hier wird gezielt NUR die
      // noch fehlende Richtung abgefragt, unabhängig von der oben
      // gewählten Abfragerichtung.
      var dir = folder === "fast" ? missingDirectionFor(item, sessionDir) : sessionDir;
      return { item: item, dir: dir };
    });

    state.learnFolder = folder;
    state.learnQueue = queue;
    state.learnIndex = 0;
    state.learnStats = { correct: 0, wrong: 0 };
    state.currentAnswered = false;
    state.lastCorrect = null;
    state.verb3FieldCorrect = null;
    state.verb3GivenAnswers = null;
    state.view = "learn";
    render();
  }

  function missingDirectionFor(item, fallbackDir){
    if(item.correctDeEn && !item.correctEnDe) return "en-de";
    if(item.correctEnDe && !item.correctDeEn) return "de-en";
    return fallbackDir; // Sollte im "Kann ich fast"-Ordner normalerweise nicht vorkommen.
  }

  // Drei-Stufen-Fortschritt:
  //  "Kann ich nicht"  -> noch keine Richtung richtig
  //  "Kann ich fast"   -> genau eine der beiden Richtungen schon richtig
  //  "Kann ich"        -> beide Richtungen schon einmal richtig
  // Ein Fehler in irgendeiner Richtung setzt beide Fortschritte zurück und
  // schickt die Vokabel zurück nach "Kann ich nicht".
  // Drei-Stufen-Fortschritt, pro Richtung einzeln verfolgt:
  //  "Kann ich nicht"  -> keine Richtung richtig
  //  "Kann ich fast"   -> genau eine der beiden Richtungen richtig
  //  "Kann ich"        -> beide Richtungen richtig
  // Ein Fehler betrifft NUR die gerade abgefragte Richtung - eine bereits
  // erledigte andere Richtung bleibt erhalten. Eine Vokabel in "Kann ich
  // fast" bleibt also so lange dort, bis auch die fehlende Richtung einmal
  // richtig beantwortet wurde; sie fällt nicht wegen eines Fehlers ganz
  // zurück auf "Kann ich nicht".
  function applyResultToItem(itemId, dir, isCorrect){
    var item = state.data.items.find(function(i){ return i.id === itemId; });
    if(item){
      if(dir === "de-en") item.correctDeEn = isCorrect;
      else item.correctEnDe = isCorrect;

      if(item.correctDeEn && item.correctEnDe) item.folder = "kann";
      else if(item.correctDeEn || item.correctEnDe) item.folder = "fast";
      else item.folder = "nicht";
    }
    saveData();
  }

  function checkAnswer(){
    var field = document.getElementById("answer-field");
    var current = state.learnQueue[state.learnIndex];
    var given = field ? field.value : "";
    var correctAnswer = current.dir === "de-en" ? current.item.en : current.item.de;
    var isCorrect = answerMatches(given, correctAnswer);

    applyResultToItem(current.item.id, current.dir, isCorrect);

    state.learnStats[isCorrect ? "correct" : "wrong"]++;
    state.currentAnswered = true;
    state.lastCorrect = isCorrect;
    render();
  }

  function checkAnswerVerb3(){
    var current = state.learnQueue[state.learnIndex];
    var item = current.item;
    var inputs = document.querySelectorAll(".verb3-answer-input");
    var given = {};
    inputs.forEach(function(inp){ given[inp.getAttribute("data-vkey")] = inp.value; });

    var fieldCorrect = {
      inf: answerMatches(given.inf, item.inf),
      past: answerMatches(given.past, item.past),
      pp: answerMatches(given.pp, item.pp)
    };
    var allCorrect = fieldCorrect.inf && fieldCorrect.past && fieldCorrect.pp;

    applyResultToItem(item.id, current.dir, allCorrect);

    state.learnStats[allCorrect ? "correct" : "wrong"]++;
    state.currentAnswered = true;
    state.lastCorrect = allCorrect;
    state.verb3FieldCorrect = fieldCorrect;
    state.verb3GivenAnswers = given;
    render();
  }

  function checkAnswerVerb3Reverse(){
    var current = state.learnQueue[state.learnIndex];
    var item = current.item;
    var field = document.getElementById("answer-field-verb3rev");
    var given = field ? field.value : "";
    var isCorrect = answerMatches(given, item.de);

    applyResultToItem(item.id, current.dir, isCorrect);

    state.learnStats[isCorrect ? "correct" : "wrong"]++;
    state.currentAnswered = true;
    state.lastCorrect = isCorrect;
    render();
  }

  function goNext(){
    state.learnIndex++;
    state.currentAnswered = false;
    state.lastCorrect = null;
    state.verb3FieldCorrect = null;
    state.verb3GivenAnswers = null;
    render();
  }

  // --- Cloud-Anmeldung (Firebase) -----------------------------------------
  function translateAuthError(err){
    var code = err && err.code;
    var map = {
      "auth/email-already-in-use": "Diese E-Mail ist bereits registriert.",
      "auth/invalid-email": "Ungültige E-Mail-Adresse.",
      "auth/weak-password": "Das Passwort muss mindestens 6 Zeichen haben.",
      "auth/user-not-found": "Kein Konto mit dieser E-Mail gefunden.",
      "auth/wrong-password": "Falsches Passwort.",
      "auth/invalid-credential": "E-Mail oder Passwort falsch.",
      "auth/too-many-requests": "Zu viele Versuche. Bitte kurz warten.",
      "auth/unauthorized-domain": "Diese Webadresse ist in Firebase noch nicht freigegeben (Authentication → Settings → Authorized domains).",
      "auth/operation-not-allowed": "E-Mail/Passwort-Anmeldung ist in Firebase noch nicht aktiviert (Authentication → Sign-in method).",
      "auth/configuration-not-found": "Firebase-Konfiguration unvollständig - bitte firebaseConfig-Werte in der Datei prüfen.",
      "auth/invalid-api-key": "Der eingetragene apiKey ist ungültig - bitte in der Datei prüfen."
    };
    if(code && map[code]) return map[code];
    // Unbekannter Fehler: den technischen Code mit anzeigen, das hilft bei
    // der Fehlersuche deutlich weiter als eine allgemeine Meldung.
    return "Etwas ist schiefgelaufen" + (code ? " (" + code + ")" : "") + ". Bitte erneut versuchen.";
  }

  function handleAuthSubmit(){
    var email = (document.getElementById("auth-email")||{}).value || "";
    var pass = (document.getElementById("auth-password")||{}).value || "";
    email = email.trim();
    if(!email || !pass){
      state.authError = "Bitte E-Mail und Passwort eingeben.";
      render();
      return;
    }
    state.authError = null;
    var authAction = state.authMode === "register"
      ? firebase.auth().createUserWithEmailAndPassword(email, pass)
      : firebase.auth().signInWithEmailAndPassword(email, pass);
    // Erfolgreiche Anmeldung wird über onAuthStateChanged() unten behandelt.
    authAction.catch(function(err){
      state.authError = translateAuthError(err);
      render();
    });
  }

  function handleLogout(){
    if(state.cloudEnabled && typeof firebase !== "undefined"){
      firebase.auth().signOut();
    }
  }

  if(CLOUD_CONFIGURED && typeof firebase !== "undefined"){
    state.cloudEnabled = true;
    state.view = "loading";
    render();
    firebase.initializeApp(firebaseConfig);
    firebase.auth().onAuthStateChanged(function(user){
      state.authError = null;
      if(user){
        state.authUser = user;
        loadData().then(function(){
          if(state.view === "loading" || state.view === "login") state.view = "home";
          render();
        });
      } else {
        state.authUser = null;
        state.view = "login";
        render();
      }
    });
  } else {
    loadData().then(render);
  }
})();
</script>
</body>
</html>
