<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vokabeltrainer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#262624;
    --bg-2:#2b2a28;
    --surface:#302f2c;
    --surface-2:#3a3936;
    --border:#46453f;
    --text:#F3F1EA;
    --text-soft:#A9A69C;
    --gold:#D2A94A;
    --gold-text:#2A2004;
    --red:#E5484D;
    --red-soft:#3A2422;
    --green:#2FA968;
    --green-soft:#1E332A;
    --blue:#4F8CF0;
    --blue-soft:#1F2C40;
    --danger:#E5484D;
    --radius:16px;
    --serif:'Lora', Georgia, serif;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh;}
  body{
    background-image: radial-gradient(circle at 30% -10%, #33322e 0%, var(--bg) 50%);
    background-attachment:fixed;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; padding:22px 18px 48px; display:flex; flex-direction:column;}

  .header{padding:8px 2px 22px;}
  .header .eyebrow{font-size:13px; color:var(--text-soft); letter-spacing:.02em;}
  .header h1{font-family:var(--sans); font-weight:600; font-size:29px; margin:3px 0 0; color:var(--text);}

  .card{
    background:var(--surface);
    border-radius:var(--radius);
    padding:18px;
    box-shadow:0 8px 22px rgba(0,0,0,.35);
    margin-bottom:14px;
    border:1px solid var(--border);
  }

  button{font-family:var(--sans); cursor:pointer; border:none;}
  .btn{
    width:100%; padding:15px 18px; border-radius:12px; font-size:16px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:9px; transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--gold); color:var(--gold-text);}
  .btn-secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn-outline{background:transparent; color:var(--text); border:1.5px solid var(--border);}
  .btn-ghost{background:transparent; color:var(--text-soft); font-weight:500; padding:10px;}
  .btn:disabled{opacity:.4; pointer-events:none;}
  .btn-danger{background:var(--danger); color:#fff;}

  .segmented{display:flex; background:var(--bg-2); border-radius:11px; padding:3px; gap:3px; border:1px solid var(--border);}
  .segmented button{flex:1; padding:9px 4px; font-size:13px; font-weight:600; border-radius:9px; background:transparent; color:var(--text-soft);}
  .segmented button.active{background:var(--surface-2); color:var(--text);}

  .label{font-size:12.5px; font-weight:600; color:var(--text-soft); margin-bottom:8px; display:block;}

  .folder-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:18px 18px; border-radius:14px; margin-bottom:10px; cursor:pointer; color:#fff;
    box-shadow:0 6px 16px rgba(0,0,0,.28);
  }
  .folder-row:active{transform:scale(0.99);}
  .folder-row .ficon{font-size:22px; line-height:1;}
  .folder-row .fname{font-family:var(--sans); font-size:17px; font-weight:600;}
  .folder-row .fcount{font-size:13px; opacity:.85; margin-top:2px;}
  .folder-row.nicht{background:linear-gradient(135deg,#E5484D,#C43A3F);}
  .folder-row.fast{background:linear-gradient(135deg,#E8B84B,#C89A2E); color:#2A2004;}
  .folder-row.kann{background:linear-gradient(135deg,#31B073,#1F8C57);}
  .folder-row.alle{background:linear-gradient(135deg,#5A9AF5,#3E76D6);}
  .folder-row.disabled{opacity:.4; box-shadow:none;}
  .chev{font-size:20px; opacity:.85;}

  .section-title{font-family:var(--sans); font-weight:600; font-size:15px; color:var(--text); margin:22px 0 10px 2px;}

  .toplink{color:var(--text-soft); font-size:14px; text-align:center; margin-top:18px; background:none; text-decoration:underline; text-underline-offset:3px;}

  .backbar{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .backbar button{background:none; color:var(--text); font-size:15px; font-weight:600; padding:6px 0; display:flex; align-items:center; gap:4px;}

  .hint{font-size:13.5px; color:var(--text-soft); line-height:1.5; margin:0 0 14px;}
  .rowpair{display:flex; gap:8px; margin-bottom:9px; align-items:center;}
  .rowpair input[type=text]{
    flex:1; min-width:0; padding:11px 12px; border-radius:9px; border:1.5px solid var(--border);
    font-size:15px; font-family:var(--sans); background:var(--bg-2); color:var(--text);
  }
  .rowpair input:focus{outline:none; border-color:var(--gold);}
  .rowpair .arrow{color:var(--text-soft); font-size:14px; flex-shrink:0;}
  .rowpair .del{background:none; color:var(--text-soft); font-size:19px; padding:4px 6px; flex-shrink:0;}
  .colheads{display:flex; gap:8px; font-size:11.5px; font-weight:600; color:var(--text-soft); margin-bottom:6px; padding:0 2px;}
  .colheads span:first-child{flex:1;}
  .colheads span:last-child{flex:1; margin-left:22px;}

  .loading{display:flex; flex-direction:column; align-items:center; padding:38px 10px; gap:14px;}
  .spinner{width:34px; height:34px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--gold); animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading p{color:var(--text-soft); font-size:14px; margin:0;}

  .quiz-progress{color:var(--text-soft); font-size:13px; text-align:center; margin-bottom:10px;}
  .flashcard{
    background:var(--surface); border-radius:20px; padding:46px 22px; text-align:center;
    box-shadow:0 10px 26px rgba(0,0,0,.35); margin-bottom:16px; border:1px solid var(--border);
  }
  .flashcard .dir{font-size:12px; font-weight:600; color:var(--text-soft); margin-bottom:14px;}
  .flashcard .word{font-family:var(--sans); font-size:32px; font-weight:600; word-break:break-word; color:var(--text);}
  .answer-input{
    width:100%; padding:15px 16px; border-radius:12px; border:1.5px solid var(--border);
    font-size:17px; font-family:var(--sans); background:var(--bg-2); color:var(--text); margin-bottom:12px; text-align:center;
  }
  .answer-input:focus{outline:none; border-color:var(--gold);}
  .answer-input.correct{border-color:var(--green); background:var(--green-soft);}
  .answer-input.wrong{border-color:var(--red); background:var(--red-soft);}

  .feedback{
    border-radius:14px; padding:18px 16px; margin-bottom:14px; display:flex; flex-direction:column; gap:6px;
    align-items:center; text-align:center;
  }
  .feedback.ok{background:var(--green-soft); color:#6FDBA0;}
  .feedback.no{background:var(--red-soft); color:#F19A9D;}
  .feedback .fb-headline{font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:6px; line-height:1; text-transform:uppercase; letter-spacing:.03em; opacity:.9;}
  .feedback .fb-icon{font-size:16px; line-height:1;}
  .feedback .fb-label{font-family:var(--sans); font-size:12.5px; font-weight:500; opacity:.85; display:block; margin-bottom:3px;}
  .feedback .fb-value{font-family:var(--sans); font-size:28px; font-weight:700; line-height:1.25; word-break:break-word;}

  .verb-card{background:var(--bg-2); border-radius:12px; padding:14px; margin-bottom:10px; border:1.5px solid var(--border); position:relative;}
  .verb-card .del{position:absolute; top:6px; right:6px; background:none; color:var(--text-soft); font-size:18px; padding:4px 8px;}
  .verb-field{margin-bottom:8px;}
  .verb-field:last-child{margin-bottom:0;}
  .verb-field label{font-size:11px; font-weight:600; color:var(--text-soft); display:block; margin-bottom:4px;}
  .verb-field input[type=text]{
    width:100%; padding:10px 12px; border-radius:9px; border:1.5px solid var(--border);
    font-size:15px; font-family:var(--sans); background:var(--surface); color:var(--text);
  }
  .verb-field input:focus{outline:none; border-color:var(--gold);}
  .verb-field input.correct{border-color:var(--green); background:var(--green-soft);}
  .verb-field input.wrong{border-color:var(--red); background:var(--red-soft);}

  .verb-prompt{display:flex; flex-direction:column; gap:6px; margin-top:4px;}
  .verb-prompt-row{display:flex; align-items:baseline; justify-content:center; gap:8px;}
  .verb-prompt-label{font-size:11.5px; font-weight:600; color:var(--text-soft); min-width:78px; text-align:right;}
  .verb-prompt-value{font-family:var(--sans); font-size:22px; font-weight:600; color:var(--text);}
  .verb-answers{display:flex; flex-direction:column; gap:10px; margin-bottom:12px;}
  .rowpair input.warn{border-color:var(--red); background:var(--red-soft);}
  .verb-field input.warn{border-color:var(--red); background:var(--red-soft);}

  .backup-row{display:flex; gap:10px; margin-top:6px;}
  .backup-row .btn{flex:1;}

  .summary-stats{display:flex; gap:10px; margin-bottom:16px;}
  .stat{flex:1; background:var(--surface); border-radius:14px; padding:16px 10px; text-align:center; border:1px solid var(--border);}
  .stat .n{font-family:var(--sans); font-size:26px; font-weight:700;}
  .stat .l{font-size:12px; color:var(--text-soft); margin-top:2px;}
  .stat.ok .n{color:#6FDBA0;}
  .stat.no .n{color:#F19A9D;}

  .vlist-item{display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--border);}
  .vlist-item:last-child{border-bottom:none;}
  .vlist-words{font-size:15px; color:var(--text);}
  .vlist-words .en{color:var(--text-soft);}
  .vlist-tag{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; margin-top:4px; display:inline-block;}
  .vlist-tag.nicht{background:var(--red-soft); color:#F19A9D;}
  .vlist-tag.fast{background:#3A3018; color:#E8B84B;}
  .vlist-tag.kann{background:var(--green-soft); color:#6FDBA0;}
  .vlist-item .del{background:none; color:#7d7b74; font-size:18px; padding:4px 8px;}
  .vlist-item .edit{background:none; color:var(--text-soft); font-size:16px; padding:4px 8px;}
  .vlist-item .item-actions{display:flex; align-items:center; flex-shrink:0;}
  .vlist-item.edit-mode{display:block; padding:14px 4px;}
  .vlist-item.edit-mode .verb-field{margin-bottom:8px;}
  .vlist-item.edit-mode .edit-actions{display:flex; gap:8px; margin-top:6px;}
  .vlist-item.edit-mode .edit-actions .btn{padding:10px; font-size:14px;}

  .empty{text-align:center; padding:30px 10px; color:var(--text-soft); font-size:14px;}

  .kann-table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -18px; padding:0 18px;}
  .kann-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .kann-table th{text-align:left; font-size:11px; font-weight:700; letter-spacing:.02em; color:var(--text-soft); padding:0 12px 8px 0; border-bottom:1.5px solid var(--border); white-space:nowrap;}
  .kann-table td{padding:10px 12px 10px 0; border-bottom:1px solid var(--border); vertical-align:top; color:var(--text);}
  .kann-table td:first-child{font-weight:600;}
  .kann-table tr:last-child td{border-bottom:none;}

  .upload-grid{display:flex; gap:10px;}
  .upload-grid .btn{flex:1;}

  #crop-container{position:relative; width:100%; border-radius:12px; overflow:hidden; touch-action:none; border:1px solid var(--border); background:#000;}
  #crop-container img{width:100%; display:block; pointer-events:none; -webkit-user-select:none; user-select:none;}
  .crop-line{position:absolute; top:0; bottom:0; width:3px; background:var(--gold); cursor:ew-resize;}
  .crop-line .handle{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:30px; height:30px; border-radius:50%; background:var(--gold); box-shadow:0 2px 8px rgba(0,0,0,.4);}
  .crop-line .handle::before{content:"‹›"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:13px; color:var(--gold-text); font-weight:700;}
  .crop-col-label{position:absolute; top:8px; font-size:11px; font-weight:700; color:#fff; background:rgba(0,0,0,.55); padding:3px 8px; border-radius:20px;}

  input[type=file]{display:none;}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";

  // ============================================================
  // CLOUD-SYNC EINRICHTEN (optional)
  // ============================================================
  // Trage hier deine eigene Firebase-Projekt-Konfiguration ein, um
  // Vokabeln automatisch über alle Geräte hinweg zu synchronisieren
  // (kein Export/Import mehr nötig). Kostenlos unter https://console.firebase.google.com
  //
  // Kurzanleitung:
  //  1. Firebase-Projekt anlegen (kostenloser "Spark"-Plan reicht).
  //  2. Build > Authentication > "E-Mail/Passwort" aktivieren.
  //  3. Build > Firestore Database > Datenbank erstellen.
  //  4. In den Firestore-Regeln (Rules-Tab) genau das hier einfügen:
  //       rules_version = '2';
  //       service cloud.firestore {
  //         match /databases/{database}/documents {
  //           match /users/{userId} {
  //             allow read, write: if request.auth != null && request.auth.uid == userId;
  //           }
  //         }
  //       }
  //  5. Projekteinstellungen (Zahnrad) > "Meine Apps" > Web-App (</>) hinzufügen.
  //     Dort bekommst du ein "firebaseConfig"-Objekt - die Werte unten eintragen.
  //
  // Ohne eigene Werte (Platzhalter unverändert) läuft die App wie bisher
  // rein lokal auf dem jeweiligen Gerät weiter - nichts bricht dadurch.
  var firebaseConfig = {
    apiKey: "AIzaSyB5Lm2vyRfT06mQPke_9139lNY5w2rJ25U",
    authDomain: "vokabeln-oscar.firebaseapp.com",
    projectId: "vokabeln-oscar",
    storageBucket: "vokabeln-oscar.firebasestorage.app",
    messagingSenderId: "741287549695",
    appId: "1:741287549695:web:82215600df52037d874aca"
  };
  var CLOUD_CONFIGURED = !!(firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("DEIN_") !== 0);
  // ============================================================

  var STORAGE_KEY = "vocab-app-data";

  var state = {
    view: "home",
    data: { items: [], settings: { direction: "de-en", verb3Direction: "de-en" } },
    reviewRows: [],
    learnQueue: [],
    learnIndex: 0,
    learnStats: { correct: 0, wrong: 0 },
    currentAnswered: false,
    lastCorrect: null,
    captureImage: null,
    cropMode: "table",
    splitPercent: 50,
    vocabType: "pair",
    cropSplits: [50],
    reviewVocabType: "pair",
    learnTypeFilter: "pair",
    editingId: null,
    manageTypeFilter: "pair",
    editFolder: null,
    cloudEnabled: false,
    authUser: null,
    authMode: "login",
    authError: null,
    ocrError: null
  };

  var dragState = { active: false, splitIdx: 0 };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  async function storageGet(){
    if(state.cloudEnabled && state.authUser){
      try{
        var docSnap = await firebase.firestore().collection("users").doc(state.authUser.uid).get();
        if(docSnap.exists){
          var payload = docSnap.data().payload;
          if(payload){
            try{ localStorage.setItem(STORAGE_KEY, payload); }catch(e){ /* ignore */ }
            return payload;
          }
        }
        return null;
      }catch(e){ /* offline o.ä. - lokalen Stand als Fallback nutzen */ }
    }
    if(window.storage && typeof window.storage.get === "function"){
      try{
        var res = await window.storage.get(STORAGE_KEY, false);
        return res ? res.value : null;
      }catch(e){ /* fall through */ }
    }
    try{ return localStorage.getItem(STORAGE_KEY); }catch(e){ return null; }
  }

  async function storageSet(value){
    if(state.cloudEnabled && state.authUser){
      try{ localStorage.setItem(STORAGE_KEY, value); }catch(e){ /* ignore */ }
      try{
        await firebase.firestore().collection("users").doc(state.authUser.uid)
          .set({ payload: value, updatedAt: Date.now() });
        return;
      }catch(e){ /* offline - Daten bleiben lokal gespeichert und werden beim nächsten
                    erfolgreichen Speichern automatisch nachgezogen */ }
      return;
    }
    if(window.storage && typeof window.storage.set === "function"){
      try{ await window.storage.set(STORAGE_KEY, value, false); return; }catch(e){ /* fall through */ }
    }
    try{ localStorage.setItem(STORAGE_KEY, value); }catch(e){ /* ignore */ }
  }

  async function loadData(){
    try{
      var raw = await storageGet();
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.items)){
          state.data = parsed;
          if(!state.data.settings) state.data.settings = { direction: "de-en", verb3Direction: "de-en" };
          // "Gemischt" wurde entfernt - alte Sicherungen auf eine feste Richtung migrieren.
          if(state.data.settings.direction !== "de-en" && state.data.settings.direction !== "en-de"){
            state.data.settings.direction = "de-en";
          }
          if(!state.data.settings.verb3Direction){
            state.data.settings.verb3Direction = "de-en";
          }
        }
      }
    }catch(e){ /* no data yet */ }
  }

  async function saveData(){
    try{ await storageSet(JSON.stringify(state.data)); }
    catch(e){ console.error("Speichern fehlgeschlagen", e); }
  }

  // Konfiguration für die beiden Vokabel-Typen: normale Wortpaare und
  // unregelmäßige Verben mit 3 Zeitformen (Infinitiv, Simple Past, Partizip II).
  var VOCAB_TYPES = {
    pair: {
      keys: ["de","en"],
      shortLabels: ["DE","EN"],
      fieldLabels: ["Deutsch","Englisch"],
      splits: [50]
    },
    verb3: {
      keys: ["de","inf","past","pp"],
      shortLabels: ["Sp. 1","Sp. 2","Sp. 3","Sp. 4"],
      fieldLabels: ["Deutsch","Infinitiv","Simple Past","Partizip II"],
      splits: [18,36,54]
    }
  };

  function vocabConfig(type){
    return VOCAB_TYPES[type] || VOCAB_TYPES.pair;
  }

  function emptyRow(type){
    var row = {};
    vocabConfig(type).keys.forEach(function(k){ row[k] = ""; });
    return row;
  }

  function itemType(item){
    return item.type || "pair";
  }

  function itemsIn(folder, type){
    var pool = folder === "alle" ? state.data.items.slice() : state.data.items.filter(function(i){ return i.folder === folder; });
    if(type) pool = pool.filter(function(i){ return itemType(i) === type; });
    return pool;
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function normalize(s){
    return (s||"").trim().toLowerCase().replace(/\s+/g," ");
  }

  // Klammer-Angaben wie "(be)kämpfen", "(sich) fühlen" oder "(fest)halten"
  // markieren einen optionalen Wortbestandteil. Beide Varianten sollen als
  // richtig gelten: mit dem Klammerinhalt (z.B. "bekämpfen"/"sich fühlen")
  // UND ohne ihn (z.B. "kämpfen"/"fühlen"). Leerzeichen bleiben dabei genau
  // so erhalten, wie sie im Original stehen.
  function expandParenthetical(text){
    if(!/\([^)]*\)/.test(text)) return [text];
    var withWord = text.replace(/[()]/g, "").trim();
    var withoutWord = text.replace(/\([^)]*\)\s*/, "").trim();
    var variants = [withWord];
    if(withoutWord && withoutWord !== withWord) variants.push(withoutWord);
    return variants;
  }

  function splitOptions(s){
    var raw = (s||"").split(/[\/,;]/).map(function(o){ return o.trim(); }).filter(Boolean);
    var expanded = [];
    raw.forEach(function(opt){
      expandParenthetical(opt).forEach(function(v){ expanded.push(normalize(v)); });
    });
    return expanded.filter(Boolean);
  }

  function answerMatches(given, accepted){
    var g = normalize(given);
    if(!g) return false;

    // 1) Exakte Übereinstimmung mit der kompletten Lösung, so wie sie
    //    angezeigt wird (z.B. "was/were" genau so eingetippt).
    if(g === normalize(accepted)) return true;

    // 2) Eine der per / , oder ; getrennten Einzeloptionen wurde eingegeben
    //    (z.B. nur "was" oder nur "were"), inkl. Klammer-Varianten
    //    (z.B. "kämpfen" oder "bekämpfen" bei "(be)kämpfen").
    var acceptedOptions = splitOptions(accepted);
    if(acceptedOptions.indexOf(g) !== -1) return true;

    // 3) Alle Optionen wurden eingegeben, nur mit einem anderen Trennzeichen
    //    als in der Lösung hinterlegt (z.B. Lösung "was, were", Eingabe
    //    "was/were" oder umgekehrt) - Reihenfolge spielt dabei keine Rolle.
    var givenOptions = splitOptions(given);
    if(givenOptions.length > 1 && acceptedOptions.length > 1){
      var sortedGiven = givenOptions.slice().sort().join("|");
      var sortedAccepted = acceptedOptions.slice().sort().join("|");
      if(sortedGiven === sortedAccepted) return true;
    }

    return false;
  }

  function render(){
    var el = document.getElementById("app");
    if(state.view === "loading") el.innerHTML = renderLoadingScreen();
    else if(state.view === "login") el.innerHTML = renderLogin();
    else if(state.view === "home") el.innerHTML = renderHome();
    else if(state.view === "capture") el.innerHTML = renderCapture();
    else if(state.view === "crop") el.innerHTML = renderCrop();
    else if(state.view === "review") el.innerHTML = renderReview();
    else if(state.view === "learn") el.innerHTML = renderLearn();
    else if(state.view === "summary") el.innerHTML = renderSummary();
    else if(state.view === "manage") el.innerHTML = renderManage();
    else if(state.view === "kannlist") el.innerHTML = renderKannList();
    bindEvents();
  }

  function renderLoadingScreen(){
    return '<div class="loading"><div class="spinner"></div><p>Lädt …</p></div>';
  }

  function renderLogin(){
    var html = '';
    html += renderHeader("Vokabeltrainer", "Anmelden für geräteübergreifende Vokabeln");
    html += '<div class="card">';
    html += '<p class="hint" style="margin-top:0;">Melde dich mit E-Mail und Passwort an, damit deine Vokabeln automatisch auf allen Geräten verfügbar sind.</p>';
    if(state.authError){
      html += '<div class="feedback no" style="margin-bottom:14px;"><div class="fb-headline"><span class="fb-icon">❌</span>'+escapeHtml(state.authError)+'</div></div>';
    }
    html += '<span class="label">E-Mail</span>';
    html += '<input type="email" id="auth-email" class="answer-input" style="margin-bottom:12px;" autocomplete="email" placeholder="du@beispiel.de">';
    html += '<span class="label">Passwort</span>';
    html += '<input type="password" id="auth-password" class="answer-input" style="margin-bottom:16px;" autocomplete="'+(state.authMode==="register"?"new-password":"current-password")+'" placeholder="mind. 6 Zeichen">';
    html += '<button class="btn btn-primary" id="btn-auth-submit" style="margin-bottom:10px;">'+(state.authMode==="register"?"Konto erstellen":"Anmelden")+'</button>';
    html += '<button class="btn-ghost" id="btn-auth-toggle" style="width:100%;">'+(state.authMode==="register"?"Schon ein Konto? Anmelden":"Noch kein Konto? Registrieren")+'</button>';
    html += '</div>';
    return html;
  }

  function renderHeader(title, sub){
    return '<div class="header"><div class="eyebrow">'+(sub||"Karteikasten für Wörter")+'</div><h1>'+title+'</h1></div>';
  }

  function renderHome(){
    var typeFilter = state.learnTypeFilter;
    var nicht = itemsIn("nicht", typeFilter).length;
    var fast = itemsIn("fast", typeFilter).length;
    var kann = itemsIn("kann", typeFilter).length;
    var alle = itemsIn("alle", typeFilter).length;

    var html = '';
    html += renderHeader("Vokabeltrainer");

    html += '<div class="card">';
    html += '<button class="btn btn-primary" id="btn-capture">📷&nbsp; Vokabeln hinzufügen</button>';
    html += '<p class="hint" style="margin:12px 0 0;">Foto aufnehmen oder ein Bild hochladen — die App erkennt Wortpaare automatisch und legt sie in „Kann ich nicht" ab.</p>';
    html += '</div>';

    html += '<div class="card">';
    html += '<span class="label">Was möchtest du lernen?</span>';
    html += '<div class="segmented" id="learn-type-segment">';
    html += '<button data-ltype="pair" class="'+(typeFilter==="pair"?"active":"")+'">Normale Vokabeln</button>';
    html += '<button data-ltype="verb3" class="'+(typeFilter==="verb3"?"active":"")+'">3 Zeitformen</button>';
    html += '</div>';
    html += '</div>';

    var activeDir = typeFilter === "verb3" ? state.data.settings.verb3Direction : state.data.settings.direction;
    html += '<div class="card">';
    html += '<span class="label">Abfragerichtung</span>';
    html += '<div class="segmented" id="dir-segment">';
    html += '<button data-dir="de-en" class="'+(activeDir==="de-en"?"active":"")+'">Deutsch → Englisch</button>';
    html += '<button data-dir="en-de" class="'+(activeDir==="en-de"?"active":"")+'">Englisch → Deutsch</button>';
    html += '</div>';
    if(typeFilter === "verb3"){
      html += '<p class="hint" style="margin:10px 0 0;">'+(activeDir==="de-en"
        ? 'Du siehst das deutsche Verb und gibst alle 3 englischen Formen ein.'
        : 'Du siehst alle 3 englischen Formen und gibst das deutsche Verb ein.')+'</p>';
    } else {
      html += '<p class="hint" style="margin:10px 0 0;">'+(activeDir==="de-en"
        ? 'Du siehst das deutsche Wort und gibst die englische Übersetzung ein.'
        : 'Du siehst das englische Wort und gibst die deutsche Übersetzung ein.')+'</p>';
    }
    html += '<p class="hint" style="margin:6px 0 0;">Bei „Kann ich fast" wird diese Auswahl ignoriert - dort wird automatisch je Vokabel die noch fehlende Richtung abgefragt.</p>';
    html += '</div>';

    html += '<div class="section-title">Karteikasten — '+(typeFilter==="verb3"?"3 Zeitformen":"Normale Vokabeln")+'</div>';
    html += folderRow("nicht", "Kann ich nicht", nicht, "nicht", "🔴");
    html += folderRow("fast", "Kann ich fast", fast, "fast", "🟡");
    html += folderRow("kann", "Kann ich", kann, "kann", "🟢");
    html += folderRow("alle", "Alle lernen", alle, "alle", "🔵");

    html += '<button class="toplink" id="btn-manage">Vokabeln verwalten</button>';

    return html;
  }

  function folderRow(id, name, count, cls, icon){
    var disabled = count === 0;
    return '<div class="folder-row '+cls+(disabled?" disabled":"")+'" data-folder="'+id+'">'+
      '<div class="ficon">'+icon+'</div>'+
      '<div style="flex:1;"><div class="fname">'+name+'</div><div class="fcount">'+count+' Vokabel'+(count===1?"":"n")+'</div></div>'+
      '<div class="chev">'+(disabled?"—":"›")+'</div></div>';
  }

  function renderCapture(){
    var html = '';
    html += backBar("home", "Vokabeln hinzufügen");
    if(state.captureLoading){
      html += '<div class="card"><div class="loading"><div class="spinner"></div><p>'+escapeHtml(state.captureLoadingMsg||"Text wird erkannt …")+'</p></div></div>';
    } else {
      html += '<div class="card">';
      html += '<span class="label">Was möchtest du hinzufügen?</span>';
      html += '<div class="segmented" id="vocab-type-segment">';
      html += '<button data-vtype="pair" class="'+(state.vocabType==="pair"?"active":"")+'">Vokabelpaar</button>';
      html += '<button data-vtype="verb3" class="'+(state.vocabType==="verb3"?"active":"")+'">Verb (3 Zeitformen)</button>';
      html += '</div>';
      html += '<p class="hint" style="margin:10px 0 0;">'+(state.vocabType==="verb3"
        ? 'Für unregelmäßige Verben wie „beißen – bite – bit – bitten". Beim Üben werden alle 3 englischen Formen abgefragt.'
        : 'Normale Deutsch/Englisch-Wortpaare.')+'</p>';
      html += '</div>';

      html += '<div class="card">';
      html += '<p class="hint" style="margin-top:0;">Am besten funktioniert die Erkennung bei klar geschriebenen Listen oder Tabellen.</p>';
      html += '<div class="upload-grid">';
      html += '<button class="btn btn-secondary" id="btn-take-photo">📷&nbsp; Foto aufnehmen</button>';
      html += '<button class="btn btn-secondary" id="btn-upload-photo">🖼️&nbsp; Bild hochladen</button>';
      html += '</div>';
      html += '<div style="height:10px;"></div>';
      html += '<button class="btn btn-outline" id="btn-manual">✎&nbsp; Manuell eingeben</button>';
      html += '<input type="file" id="file-input-camera" accept="image/*" capture="environment">';
      html += '<input type="file" id="file-input-upload" accept="image/*">';
      html += '</div>';
    }
    return html;
  }

  function renderCrop(){
    var cfg = vocabConfig(state.vocabType);
    var colCount = cfg.keys.length;
    var html = '';
    html += backBar("capture", "Foto vorbereiten");
    html += '<div class="card">';
    html += '<span class="label">Spalten zuschneiden ('+colCount+')</span>';
    html += '<p class="hint" style="margin-top:0;">Verschiebe die Linien grob zwischen die Spalten - Präzision ist nicht nötig, ein kleiner Abstand zum Text reicht. '+(state.vocabType==="verb3"?"In welcher Reihenfolge Deutsch/Infinitiv/Simple Past/Partizip stehen, ist egal — die App erkennt automatisch, welche Spalte Deutsch ist. Die letzte Spalte (meist die deutsche Bedeutung) darf ruhig deutlich breiter sein.":"Das trennt die Texterkennung sauber pro Spalte.")+'</p>';
    html += '<div id="crop-container">';
    html += '<img src="'+state.captureImage+'">';
    var boundaries = [0].concat(state.cropSplits).concat([100]);
    for(var ci=0; ci<colCount; ci++){
      var centerPct = (boundaries[ci] + boundaries[ci+1]) / 2;
      html += '<div class="crop-col-label" style="left:'+centerPct+'%; transform:translateX(-50%);">'+cfg.shortLabels[ci]+'</div>';
    }
    state.cropSplits.forEach(function(pct, i){
      html += '<div class="crop-line" data-split-idx="'+i+'" style="left:'+pct+'%;"><div class="handle"></div></div>';
    });
    html += '</div>';
    html += '</div>';
    html += '<button class="btn btn-primary" id="btn-crop-continue">Weiter</button>';
    return html;
  }

  function backBar(target, title){
    return '<div class="backbar"><button data-nav="'+target+'">‹ Zurück</button></div>'+renderHeader(title, "");
  }

  function renderReview(){
    var cfg = vocabConfig(state.reviewVocabType);
    var html = '';
    html += backBar("capture", "Vokabeln prüfen");

    if(state.ocrError){
      html += '<div class="card">';
      html += '<div class="feedback no"><div class="fb-headline"><span class="fb-icon">⚠️</span>Texterkennung fehlgeschlagen</div>';
      html += '<div style="margin-top:6px;"><span class="fb-label">Technischer Fehler</span><div class="fb-value" style="font-size:15px;">'+escapeHtml(state.ocrError)+'</div></div></div>';
      html += '<p class="hint" style="margin:10px 0 0;">Du kannst die Vokabeln unten manuell eingeben, oder es mit einem anderen/schärferen Foto erneut versuchen.</p>';
      html += '</div>';
    }

    html += '<div class="card">';

    if(state.reviewVocabType === "verb3"){
      html += '<p class="hint" style="margin-top:0;">Bitte kurz kontrollieren und korrigieren, bevor die Verben gespeichert werden. <b>Rot markierte Felder</b> wurden nicht erkannt und sollten ergänzt werden.</p>';
      state.reviewRows.forEach(function(row, idx){
        html += '<div class="verb-card" data-idx="'+idx+'">';
        html += '<button class="del" data-del="'+idx+'">×</button>';
        cfg.keys.forEach(function(k, ki){
          var isEmpty = !(row[k]||"").trim();
          html += '<div class="verb-field"><label>'+cfg.fieldLabels[ki]+'</label>';
          html += '<input type="text" class="rev-field'+(isEmpty?" warn":"")+'" data-key="'+k+'" value="'+escapeHtml(row[k])+'" placeholder="'+cfg.fieldLabels[ki].toLowerCase()+'"></div>';
        });
        html += '</div>';
      });
    } else {
      html += '<p class="hint" style="margin-top:0;">Bitte kurz kontrollieren und korrigieren, bevor die Vokabeln gespeichert werden. <b>Rot markierte Felder</b> wurden nicht erkannt und sollten ergänzt werden. Die Sprachen werden automatisch erkannt — falls Deutsch/Englisch vertauscht sind, einfach tauschen:</p>';
      html += '<button class="btn btn-outline" id="btn-swap-columns" style="margin-bottom:14px;">⇄&nbsp; Deutsch / Englisch tauschen</button>';
      html += '<div class="colheads"><span>Deutsch</span><span>Englisch</span></div>';
      state.reviewRows.forEach(function(row, idx){
        html += '<div class="rowpair" data-idx="'+idx+'">';
        html += '<input type="text" class="rev-de'+((row.de||"").trim()?"":" warn")+'" value="'+escapeHtml(row.de)+'" placeholder="deutsch">';
        html += '<span class="arrow">→</span>';
        html += '<input type="text" class="rev-en'+((row.en||"").trim()?"":" warn")+'" value="'+escapeHtml(row.en)+'" placeholder="english">';
        html += '<button class="del" data-del="'+idx+'">×</button>';
        html += '</div>';
      });
    }
    html += '<button class="btn-ghost" id="btn-add-row" style="padding:8px 0;">+ '+(state.reviewVocabType==="verb3"?"Verb":"Zeile")+' hinzufügen</button>';
    html += '</div>';
    html += '<button class="btn btn-primary" id="btn-save-review">In „Kann ich nicht" speichern</button>';
    return html;
  }

  var DIR_LABEL = { "de-en": "Deutsch → Englisch", "en-de": "Englisch → Deutsch" };

  // Große, klar sichtbare Rückmeldung. Zeigt die Lösung IMMER an - auch bei
  // richtiger Antwort - damit man sie sich zusätzlich einprägen kann.
  function feedbackBanner(isCorrect, solutionText){
    var html = '<div class="feedback '+(isCorrect?"ok":"no")+'">';
    html += '<div class="fb-headline"><span class="fb-icon">'+(isCorrect?"✅":"❌")+'</span>'+(isCorrect?"Richtig":"Leider falsch")+'</div>';
    html += '<div><span class="fb-label">Lösung</span><div class="fb-value">'+escapeHtml(solutionText)+'</div></div>';
    html += '</div>';
    return html;
  }

  function renderLearn(){
    var total = state.learnQueue.length;
    var idx = state.learnIndex;
    if(idx >= total){
      state.view = "summary";
      return renderSummary();
    }
    var current = state.learnQueue[idx];
    var html = '';
    html += backBar("home", folderTitle(state.learnFolder));
    html += '<div class="quiz-progress">Vokabel '+(idx+1)+' von '+total+'</div>';

    if(itemType(current.item) === "verb3"){
      return html + renderLearnVerb3(current);
    }
    return html + renderLearnPair(current);
  }

  function renderLearnPair(current){
    var html = '';
    html += '<div class="flashcard">';
    html += '<div class="dir">'+DIR_LABEL[current.dir]+'</div>';
    html += '<div class="word">'+escapeHtml(current.dir==="de-en" ? current.item.de : current.item.en)+'</div>';
    html += '</div>';

    var inputClass = "answer-input";
    if(state.currentAnswered) inputClass += state.lastCorrect ? " correct" : " wrong";

    html += '<input type="text" class="'+inputClass+'" id="answer-field" placeholder="Übersetzung eingeben" autocomplete="off" autocapitalize="off" autocorrect="off" '+(state.currentAnswered?"readonly":"")+'>';

    if(state.currentAnswered){
      var correctAnswer = current.dir==="de-en" ? current.item.en : current.item.de;
      html += feedbackBanner(state.lastCorrect, correctAnswer);
      html += '<button class="btn btn-primary" id="btn-next">Weiter</button>';
    } else {
      html += '<button class="btn btn-primary" id="btn-check">Prüfen</button>';
    }
    return html;
  }

  var VERB3_FIELDS = [
    { key: "inf", label: "Infinitiv" },
    { key: "past", label: "Simple Past" },
    { key: "pp", label: "Partizip II" }
  ];

  function renderLearnVerb3(current){
    return current.dir === "en-de" ? renderLearnVerb3EnToDe(current) : renderLearnVerb3DeToEn(current);
  }

  function renderLearnVerb3DeToEn(current){
    var item = current.item;
    var html = '';
    html += '<div class="flashcard">';
    html += '<div class="dir">Deutsch → Englisch (3 Zeitformen)</div>';
    html += '<div class="word">'+escapeHtml(item.de)+'</div>';
    html += '</div>';

    html += '<div class="verb-answers">';
    VERB3_FIELDS.forEach(function(f){
      var cls = "";
      if(state.currentAnswered){
        cls = (state.verb3FieldCorrect && state.verb3FieldCorrect[f.key]) ? " correct" : " wrong";
      }
      var givenVal = (state.currentAnswered && state.verb3GivenAnswers) ? (state.verb3GivenAnswers[f.key]||"") : "";
      html += '<div class="verb-field"><label>'+f.label+'</label>';
      html += '<input type="text" class="verb3-answer-input'+cls+'" data-vkey="'+f.key+'" autocomplete="off" autocapitalize="off" autocorrect="off" '+(state.currentAnswered?"readonly":"")+' value="'+escapeHtml(givenVal)+'"></div>';
    });
    html += '</div>';

    if(state.currentAnswered){
      var solutionText = item.inf+' – '+item.past+' – '+item.pp;
      html += feedbackBanner(state.lastCorrect, solutionText);
      html += '<button class="btn btn-primary" id="btn-next">Weiter</button>';
    } else {
      html += '<button class="btn btn-primary" id="btn-check-verb3">Prüfen</button>';
    }
    return html;
  }

  function renderLearnVerb3EnToDe(current){
    var item = current.item;
    var html = '';
    html += '<div class="flashcard">';
    html += '<div class="dir">Englisch → Deutsch (3 Zeitformen)</div>';
    html += '<div class="verb-prompt">';
    VERB3_FIELDS.forEach(function(f){
      html += '<div class="verb-prompt-row"><span class="verb-prompt-label">'+f.label+'</span><span class="verb-prompt-value">'+escapeHtml(item[f.key])+'</span></div>';
    });
    html += '</div>';
    html += '</div>';

    var inputClass = "answer-input";
    if(state.currentAnswered) inputClass += state.lastCorrect ? " correct" : " wrong";

    html += '<input type="text" class="'+inputClass+'" id="answer-field-verb3rev" placeholder="Deutsches Verb eingeben" autocomplete="off" autocapitalize="off" autocorrect="off" '+(state.currentAnswered?"readonly":"")+'>';

    if(state.currentAnswered){
      html += feedbackBanner(state.lastCorrect, item.de);
      html += '<button class="btn btn-primary" id="btn-next">Weiter</button>';
    } else {
      html += '<button class="btn btn-primary" id="btn-check-verb3-rev">Prüfen</button>';
    }
    return html;
  }

  function folderTitle(f){
    if(f==="nicht") return "Kann ich nicht";
    if(f==="fast") return "Kann ich fast";
    if(f==="kann") return "Kann ich";
    return "Alle Vokabeln";
  }

  // Reine Übersicht ohne Abfrage: zeigt alle Vokabeln aus "Kann ich" als
  // übersichtliche Tabelle, beginnend mit dem deutschen Wort. Bei Verben
  // werden alle 3 Zeitformen mit angezeigt.
  function renderKannList(){
    var typeFilter = state.learnTypeFilter;
    var isVerb3 = typeFilter === "verb3";
    var items = itemsIn("kann", typeFilter).slice().sort(function(a,b){
      return (a.de||"").localeCompare(b.de||"", "de");
    });

    var html = '';
    html += backBar("home", "Kann ich" + (isVerb3 ? " — 3 Zeitformen" : ""));

    if(items.length === 0){
      html += '<div class="card"><div class="empty">Noch keine Vokabeln in „Kann ich".<br>Übe ein paar Runden, dann tauchen sie hier auf.</div></div>';
      return html;
    }

    html += '<div class="card">';
    html += '<p class="hint" style="margin-top:0;">'+items.length+' Vokabel'+(items.length===1?"":"n")+' — nur zur Übersicht, keine Abfrage.</p>';
    html += '<div class="kann-table-wrap"><table class="kann-table"><thead><tr>';
    if(isVerb3){
      html += '<th>Deutsch</th><th>Infinitiv</th><th>Simple Past</th><th>Partizip II</th>';
    } else {
      html += '<th>Deutsch</th><th>Englisch</th>';
    }
    html += '</tr></thead><tbody>';
    items.forEach(function(item){
      html += '<tr>';
      if(isVerb3){
        html += '<td>'+escapeHtml(item.de)+'</td><td>'+escapeHtml(item.inf)+'</td><td>'+escapeHtml(item.past)+'</td><td>'+escapeHtml(item.pp)+'</td>';
      } else {
        html += '<td>'+escapeHtml(item.de)+'</td><td>'+escapeHtml(item.en)+'</td>';
      }
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    html += '</div>';
    return html;
  }

  function renderSummary(){
    var s = state.learnStats;
    var html = '';
    html += backBar("home", "Fertig!");
    html += '<div class="summary-stats">';
    html += '<div class="stat ok"><div class="n">'+s.correct+'</div><div class="l">richtig</div></div>';
    html += '<div class="stat no"><div class="n">'+s.wrong+'</div><div class="l">falsch</div></div>';
    html += '</div>';
    html += '<p class="hint">Nach der ersten richtig beantworteten Richtung wandert eine Vokabel nach „Kann ich fast" - dort wird gezielt nur noch die fehlende Richtung abgefragt. Ein Fehler betrifft dabei immer nur die gerade abgefragte Richtung: die andere, bereits erledigte Richtung bleibt erhalten. Erst wenn beide Richtungen richtig sind, geht es weiter nach „Kann ich".</p>';
    html += '<button class="btn btn-primary" id="btn-home">Zur Übersicht</button>';
    return html;
  }

  function renderManage(){
    var html = '';
    html += backBar("home", "Vokabeln verwalten");

    if(state.cloudEnabled && state.authUser){
      html += '<div class="card">';
      html += '<span class="label">Cloud-Konto</span>';
      html += '<p class="hint" style="margin-top:0;">Angemeldet als <b>'+escapeHtml(state.authUser.email||"")+'</b>. Deine Vokabeln werden automatisch auf allen Geräten synchronisiert, auf denen du dich mit diesem Konto anmeldest.</p>';
      html += '<button class="btn btn-outline" id="btn-logout">Abmelden</button>';
      html += '</div>';
    }

    html += '<div class="card">';
    html += '<span class="label">Sichern &amp; auf anderem Gerät nutzen</span>';
    html += '<p class="hint" style="margin-top:0;">Als Datei speichern und auf einem anderen Gerät (z.B. Tablet) wieder einlesen, um alle Vokabeln zu übertragen.</p>';
    html += '<div class="backup-row">';
    html += '<button class="btn btn-secondary" id="btn-export">⬇️&nbsp; Exportieren</button>';
    html += '<button class="btn btn-secondary" id="btn-import">⬆️&nbsp; Importieren</button>';
    html += '</div>';
    html += '<input type="file" id="file-input-import" accept="application/json,.json">';
    html += '</div>';

    if(state.data.items.length === 0){
      html += '<div class="card"><div class="empty">Noch keine Vokabeln vorhanden.<br>Füge eine Liste hinzu, um loszulegen.</div></div>';
      return html;
    }

    html += '<div class="card">';
    html += '<span class="label">Welche Vokabeln bearbeiten?</span>';
    html += '<div class="segmented" id="manage-type-segment">';
    html += '<button data-mtype="pair" class="'+(state.manageTypeFilter==="pair"?"active":"")+'">Normale Vokabeln</button>';
    html += '<button data-mtype="verb3" class="'+(state.manageTypeFilter==="verb3"?"active":"")+'">3 Zeitformen</button>';
    html += '</div>';
    html += '</div>';

    var visibleItems = state.data.items.filter(function(i){ return itemType(i) === state.manageTypeFilter; });
    if(visibleItems.length === 0){
      html += '<div class="card"><div class="empty">Keine '+(state.manageTypeFilter==="verb3"?"Verben mit 3 Zeitformen":"normalen Vokabeln")+' vorhanden.</div></div>';
      return html;
    }

    var FOLDER_OPTIONS = [
      { id: "nicht", label: "Kann ich nicht" },
      { id: "fast", label: "Kann ich fast" },
      { id: "kann", label: "Kann ich" }
    ];

    html += '<div class="card">';
    visibleItems.slice().sort(function(a,b){return (a.de||"").localeCompare(b.de||"","de");}).forEach(function(item){
      if(state.editingId === item.id){
        var cfg = vocabConfig(itemType(item));
        var activeFolder = state.editFolder || item.folder;
        html += '<div class="vlist-item edit-mode" data-edit-id="'+item.id+'">';
        cfg.keys.forEach(function(k, ki){
          html += '<div class="verb-field"><label>'+cfg.fieldLabels[ki]+'</label>';
          html += '<input type="text" class="edit-field" data-key="'+k+'" value="'+escapeHtml(item[k]||"")+'"></div>';
        });
        html += '<div class="verb-field"><label>Karteikasten</label>';
        html += '<div class="segmented" id="edit-folder-segment">';
        FOLDER_OPTIONS.forEach(function(f){

        });
        html += '</div></div>';
        html += '<div class="edit-actions">';
        html += '<button class="btn btn-primary" data-save-edit="'+item.id+'">Speichern</button>';
        html += '<button class="btn btn-secondary" data-cancel-edit="1">Abbrechen</button>';
        html += '</div></div>';
      } else {
        html += '<div class="vlist-item">';
        if(itemType(item) === "verb3"){
          html += '<div><div class="vlist-words">'+escapeHtml(item.de)+' <span class="en">— '+escapeHtml(item.inf)+' / '+escapeHtml(item.past)+' / '+escapeHtml(item.pp)+'</span></div>';
        } else {

        }

        html += '<button class="edit" data-edititem="'+item.id+'">✎</button>';
        html += '<button class="del" data-delitem="'+item.id+'">×</button>';
        html += '</div></div>';
      }
    });
    html += '</div>';
    return html;
  }

  // global drag handlers bound once
  function updateCropSplit(clientX){
    var container = document.getElementById("crop-container");
    if(!container) { dragState.active = false; return; }
    var idx = dragState.splitIdx;
    var line = container.querySelector('.crop-line[data-split-idx="'+idx+'"]');
    if(!line) { dragState.active = false; return; }
    var rect = container.getBoundingClientRect();
    var pct = ((clientX - rect.left) / rect.width) * 100;

    // Mindestabstand zu Nachbar-Linien und zum Bildrand einhalten, damit
    // keine Spalte mit Breite 0 (oder negativ) entsteht.
    var minGap = 5;
    var lowerBound = idx === 0 ? minGap : state.cropSplits[idx-1] + minGap;
    var upperBound = idx === state.cropSplits.length-1 ? 100-minGap : state.cropSplits[idx+1] - minGap;
    pct = Math.max(lowerBound, Math.min(upperBound, pct));

    state.cropSplits[idx] = pct;
    state.splitPercent = state.cropSplits[0]; // Rückwärtskompatibilität
    line.style.left = pct + "%";
  }
  window.addEventListener("pointermove", function(e){
    if(dragState.active) updateCropSplit(e.clientX);
  });
  window.addEventListener("pointerup", function(){ dragState.active = false; });
  window.addEventListener("pointercancel", function(){ dragState.active = false; });

  function handlePhoto(file){
    var reader = new FileReader();
    reader.onload = function(){
      if(typeof Tesseract === "undefined"){
        state.reviewVocabType = state.vocabType;

      state.captureImage = reader.result;
      state.cropMode = "table";
      state.cropSplits = vocabConfig(state.vocabType).splits.slice();
      state.splitPercent = state.cropSplits[0];
      state.view = "crop";
      render();
    };
    reader.readAsDataURL(file);
  }
